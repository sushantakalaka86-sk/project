<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body>

<h2>SK Bank Login</h2>

<input id="acc" placeholder="Account Number"><br><br>
<input id="cid" placeholder="Customer ID"><br><br>

<button onclick="login()">Login</button>

<script>

function login(){

fetch("http://127.0.0.1:5000/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
account_number:acc.value,
customer_id:cid.value
})
})
.then(r=>r.json())
.then(data=>{

if(data.success){

localStorage.setItem(
"user",
JSON.stringify(data)
);

window.location="dashboard.html";

}else{
alert("Login Failed");
}

});

}
</script>

</body>
</html>
